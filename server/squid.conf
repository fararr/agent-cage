# /etc/squid/squid.conf — the egress allowlist. Runs on the host, outside the
# containers; a compromised container cannot reconfigure it.
http_port 3128 name=build
http_port 3129 name=work
http_port 3130 name=locked

acl p_build  myportname build
acl p_work   myportname work
acl p_locked myportname locked

acl d_model dstdomain "/etc/squid/domains/model.txt"
acl d_scm   dstdomain "/etc/squid/domains/scm.txt"
acl d_pkg   dstdomain "/etc/squid/domains/pkg.txt"

acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

http_access allow p_build  d_model
http_access allow p_build  d_scm
http_access allow p_build  d_pkg
http_access allow p_work   d_model
http_access allow p_work   d_scm
http_access allow p_locked d_model
http_access deny all

cache deny all
access_log /var/log/squid/access.log
