# /etc/squid/squid.conf — the egress allowlist. Runs on the host, outside the
# containers; a compromised container cannot reconfigure it.
http_port 3128 name=build
http_port 3129 name=work
http_port 3130 name=locked

acl p_build  myportname build
acl p_work   myportname work
acl p_locked myportname locked

acl d_model dstdomain "/etc/squid/domains/model.txt"
acl d_scm   dstdomain "/etc/squid/domains/scm.txt"
acl d_pkg   dstdomain "/etc/squid/domains/pkg.txt"
acl d_docs  dstdomain "/etc/squid/domains/docs.txt"
# Temporary grants, and the only list not kept in git: a customer's domains never
# reach the repo, and a redeploy cannot resurrect a grant you revoked. Created by
# bootstrap.sh holding `disabled.invalid`, because squid rejects an ACL file with
# no entries and a .invalid domain matches nothing.
acl d_temp  dstdomain "/etc/squid/domains/temp.txt"

acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports

# The profile is the port, but the port must never be the *only* control: these
# ACLs carry no source restriction, so anything that can reach an open port can
# use the proxy for whatever that port allows. Containers only, in every
# profile. Belt and braces with the INPUT rules in agent-set-profile.
acl docker_src src 172.16.0.0/12
http_access deny !docker_src

http_access allow p_build  d_model
http_access allow p_build  d_scm
http_access allow p_build  d_pkg
http_access allow p_build  d_docs
http_access allow p_build  d_temp
http_access allow p_work   d_model
http_access allow p_work   d_scm
http_access allow p_work   d_docs
http_access allow p_work   d_temp
# `locked` stays model-only on purpose. Docs and temporary grants are both
# hostnames squid cannot see inside, so both are exfil paths; the profile that
# earns the right to run unattended does not get them.
http_access allow p_locked d_model
http_access deny all

cache deny all
access_log /var/log/squid/access.log
